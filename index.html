<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Aesthetic Ambience - YouTube Audio Player</title>

  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .safe-top {
      padding-top: max(1rem, env(safe-area-inset-top));
    }
    .safe-bottom {
      padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
    }
  </style>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body class="bg-stone-950 text-white select-none m-0 p-0 font-sans">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const BG_VIDEOS = Array.from({ length: 42 }, (_, i) => `./videos/bg_${i + 1}.mp4`);

    // Updated Playlist with the requested songs
    const YOUTUBE_PLAYLIST = [
      { id: 1, title: "Aankhon Mein Tera Hi Chehra", artist: "Aryans", youtubeId: "V3vSJyHWFEw" },
      { id: 2, title: "Jahaan Tum Ho", artist: "Shrey Singhal", youtubeId: "Hxe362w66GI" },
      { id: 3, title: "Teri Yaadein (Korean Mix)", artist: "Atif Aslam", youtubeId: "eafo6MoqDPw" },
      { id: 4, title: "Tu Mile Dil Khile", artist: "Kumar Sanu & Alka Yagnik", youtubeId: "nqTS7ngviwQ" },
      { id: 5, title: "Tum To Thehre Pardesi", artist: "Altaf Raja", youtubeId: "HaqGZcvbt1U" },
      { id: 6, title: "Pyaar Tune Kya Kiya", artist: "Jubin Nautiyal", youtubeId: "gC84vJf0xeU" },
      { id: 7, title: "Chale Aana", artist: "Armaan Malik & Amaal Mallik", youtubeId: "fWQpb6T89d4" },
      { id: 8, title: "Mann Mera", artist: "Gajendra Verma", youtubeId: "HP2zqQsrsyg" },
      { id: 9, title: "Maine Royaan", artist: "Tanveer Evan", youtubeId: "o7In7se2Kl4" },
      { id: 10, title: "Tera Ghata", artist: "Gajendra Verma", youtubeId: "0KNk-Joi-NM" },
      { id: 11, title: "Tujhe Bhula Diya", artist: "Mohit Chauhan & Shekhar Ravjiani", youtubeId: "M1JZOQ8-vRU" },
      { id: 12, title: "Tujhe Dekhe Bina", artist: "Rakesh Sutradhar", youtubeId: "mGFlSPG6ZKc" },
      { id: 13, title: "Dard", artist: "Kushagra & Showkidd", youtubeId: "tJ51nR4-tLs" },
      { id: 14, title: "Aaja We Mahiya", artist: "Imran Khan", youtubeId: "BJtbYaVwyEI" },
      { id: 15, title: "Rula Ke Gaya Ishq", artist: "Stebin Ben", youtubeId: "g-C8QJH-NWI" }
    ];

    function App() {
      const [playlist] = useState(YOUTUBE_PLAYLIST);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [videoIndex, setVideoIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isShuffle, setIsShuffle] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [isMuted, setIsMuted] = useState(false);

      const ytPlayerRef = useRef(null);
      const videoRef = useRef(null);
      const timerRef = useRef(null);
      const touchStartY = useRef(0);

      const currentTrack = playlist[currentIndex];

      useEffect(() => {
        const setupYouTube = () => {
          if (window.YT && window.YT.Player) {
            ytPlayerRef.current = new window.YT.Player("yt-hidden-audio", {
              height: "1",
              width: "1",
              videoId: currentTrack.youtubeId,
              playerVars: {
                autoplay: 0,
                controls: 0,
                disablekb: 1,
                fs: 0,
                modestbranding: 1,
                playsinline: 1
              },
              events: {
                onReady: (e) => {
                  setDuration(e.target.getDuration() || 180);
                },
                onStateChange: (e) => {
                  if (e.data === window.YT.PlayerState.PLAYING) {
                    setIsPlaying(true);
                    setDuration(e.target.getDuration() || 180);
                    if (videoRef.current) videoRef.current.play().catch(() => {});
                  } else if (e.data === window.YT.PlayerState.PAUSED) {
                    setIsPlaying(false);
                    if (videoRef.current) videoRef.current.pause();
                  } else if (e.data === window.YT.PlayerState.ENDED) {
                    changeTrack("next");
                  }
                }
              }
            });
          }
        };

        if (!window.YT) {
          window.onYouTubeIframeAPIReady = setupYouTube;
        } else {
          setupYouTube();
        }

        return () => {
          if (ytPlayerRef.current?.destroy) ytPlayerRef.current.destroy();
        };
      }, []);

      useEffect(() => {
        if (isPlaying) {
          timerRef.current = setInterval(() => {
            if (ytPlayerRef.current?.getCurrentTime) {
              const time = ytPlayerRef.current.getCurrentTime();
              setCurrentTime(time || 0);
            }
          }, 250);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isPlaying]);

      useEffect(() => {
        if (ytPlayerRef.current?.loadVideoById) {
          ytPlayerRef.current.loadVideoById(currentTrack.youtubeId);
          setCurrentTime(0);
          if (isPlaying) {
            ytPlayerRef.current.playVideo();
          }
        }
      }, [currentIndex]);

      const togglePlay = () => {
        if (!ytPlayerRef.current) return;
        if (isPlaying) {
          ytPlayerRef.current.pauseVideo();
        } else {
          ytPlayerRef.current.playVideo();
        }
      };

      const changeTrack = (direction) => {
        let nextIdx;
        if (isShuffle) {
          nextIdx = Math.floor(Math.random() * playlist.length);
        } else {
          nextIdx = direction === "next" 
            ? (currentIndex + 1) % playlist.length
            : (currentIndex - 1 + playlist.length) % playlist.length;
        }
        setCurrentIndex(nextIdx);
        setCurrentTime(0);
      };

      const seekRelative = (seconds) => {
        if (ytPlayerRef.current?.getCurrentTime && ytPlayerRef.current?.seekTo) {
          const newTime = Math.min(Math.max(ytPlayerRef.current.getCurrentTime() + seconds, 0), duration || 0);
          ytPlayerRef.current.seekTo(newTime, true);
          setCurrentTime(newTime);
        }
      };

      const toggleMute = () => {
        if (!ytPlayerRef.current) return;
        if (isMuted) {
          ytPlayerRef.current.unMute();
          setIsMuted(false);
        } else {
          ytPlayerRef.current.mute();
          setIsMuted(true);
        }
      };

      const nextBackgroundVideo = (e) => {
        e.stopPropagation();
        setVideoIndex((prev) => (prev + 1) % BG_VIDEOS.length);
      };

      const handleTouchStart = (e) => { 
        touchStartY.current = e.touches[0].clientY; 
      };

      const handleTouchEnd = (e) => {
        const diffY = touchStartY.current - e.changedTouches[0].clientY;
        if (diffY > 60) changeTrack("next");
        else if (diffY < -60) changeTrack("prev");
      };

      const progressPercent = Math.min(100, Math.max(0, (currentTime / (duration || 1)) * 100));

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      return (
        <div 
          className="relative w-full h-[100dvh] bg-stone-950 overflow-hidden flex flex-col justify-between"
          onTouchStart={handleTouchStart}
          onTouchEnd={handleTouchEnd}
        >
          {/* YouTube Hidden IFrame Target */}
          <div className="absolute -top-[9999px] -left-[9999px] opacity-0 pointer-events-none" aria-hidden="true">
            <div id="yt-hidden-audio"></div>
          </div>

          {/* Background Video */}
          <video
            ref={videoRef}
            key={BG_VIDEOS[videoIndex]}
            src={BG_VIDEOS[videoIndex]}
            className="absolute inset-0 w-full h-full object-cover pointer-events-none"
            autoPlay
            loop
            muted
            playsInline
          />

          {/* Screen Tap Overlay for Play/Pause */}
          <div 
            className="absolute inset-0 bg-gradient-to-b from-stone-950/70 via-stone-950/20 to-stone-950/90 cursor-pointer"
            onClick={togglePlay}
          />

          {/* Top Header */}
          <header className="relative z-20 safe-top px-4 flex items-center justify-between w-full">
            <div className="text-[11px] sm:text-xs uppercase tracking-wider text-amber-400 font-bold flex items-center gap-1.5 drop-shadow">
              <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
              Aesthetic Ambience
            </div>

            <button 
              onClick={nextBackgroundVideo}
              className="bg-black/50 hover:bg-black/70 border border-amber-400/30 active:scale-95 text-amber-300 font-medium px-3 py-1 rounded-full text-xs transition backdrop-blur-md"
              title="Switch Background Video"
            >
              🎬 #{videoIndex + 1}
            </button>
          </header>

          {/* Bottom Player Section */}
          <footer className="relative z-20 safe-bottom px-4 sm:px-6 flex flex-col gap-2.5 bg-gradient-to-t from-black via-black/80 to-transparent">
            {/* Progress Bar & Timestamps */}
            <div className="w-full flex flex-col gap-1">
              <div 
                className="w-full h-4 flex items-center cursor-pointer touch-none"
                onClick={(e) => {
                  const rect = e.currentTarget.getBoundingClientRect();
                  const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                  if (ytPlayerRef.current?.seekTo) {
                    ytPlayerRef.current.seekTo(pos * duration, true);
                    setCurrentTime(pos * duration);
                  }
                }}
              >
                <div className="w-full bg-white/20 h-1.5 rounded-full overflow-hidden">
                  <div className="bg-amber-400 h-full transition-all duration-75" style={{ width: `${progressPercent}%` }} />
                </div>
              </div>
              <div className="flex justify-between text-[10px] sm:text-xs text-stone-400 font-mono -mt-1 px-0.5">
                <span>{formatTime(currentTime)}</span>
                <span>{formatTime(duration)}</span>
              </div>
            </div>

            {/* Song Info & Controls Container */}
            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pb-1">
              {/* Title & Artist */}
              <div className="min-w-0 pr-2">
                <h2 className="text-sm sm:text-base font-bold text-amber-300 truncate drop-shadow">{currentTrack.title}</h2>
                <p className="text-xs text-neutral-400 truncate">{currentTrack.artist}</p>
              </div>

              {/* Controls Toolbar */}
              <div className="flex items-center justify-between sm:justify-end gap-1 sm:gap-2">
                {/* Shuffle */}
                <button 
                  onClick={() => setIsShuffle(!isShuffle)} 
                  className={`p-2 text-sm sm:text-base transition active:scale-95 ${isShuffle ? "text-amber-400" : "text-neutral-400"}`}
                  title="Toggle Shuffle"
                >
                  🔀
                </button>

                {/* Prev */}
                <button 
                  onClick={() => changeTrack("prev")} 
                  className="p-2 text-neutral-300 active:scale-95 text-base sm:text-lg"
                  title="Previous Track"
                >
                  ⏮
                </button>

                {/* Rewind 10s */}
                <button 
                  onClick={() => seekRelative(-10)} 
                  className="px-2 py-1 text-xs text-neutral-300 active:scale-95 font-mono"
                  title="Rewind 10s"
                >
                  -10s
                </button>

                {/* Play / Pause Primary Button */}
                <button 
                  onClick={togglePlay} 
                  className="w-10 h-10 sm:w-11 sm:h-11 flex items-center justify-center bg-amber-400 text-stone-950 rounded-full transition transform active:scale-90 font-bold shadow-lg shrink-0"
                  title={isPlaying ? "Pause" : "Play"}
                >
                  {isPlaying ? "❚❚" : "▶"}
                </button>

                {/* Fast Forward 10s */}
                <button 
                  onClick={() => seekRelative(10)} 
                  className="px-2 py-1 text-xs text-neutral-300 active:scale-95 font-mono"
                  title="Forward 10s"
                >
                  +10s
                </button>

                {/* Next */}
                <button 
                  onClick={() => changeTrack("next")} 
                  className="p-2 text-neutral-300 active:scale-95 text-base sm:text-lg"
                  title="Next Track"
                >
                  ⏭
                </button>

                {/* Mute */}
                <button 
                  onClick={toggleMute} 
                  className="p-2 text-neutral-300 active:scale-95 text-sm sm:text-base"
                  title={isMuted ? "Unmute" : "Mute"}
                >
                  {isMuted ? "🔇" : "🔊"}
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
