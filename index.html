    function App() {
      const [playlist] = useState(YOUTUBE_PLAYLIST);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [fontIndex, setFontIndex] = useState(11); // Style 12 default
      const [isPlaying, setIsPlaying] = useState(false);
      const [isShuffle, setIsShuffle] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [isMuted, setIsMuted] = useState(false);

      const ytPlayerRef = useRef(null);
      const videoRef = useRef(null);
      const timerRef = useRef(null);
      const touchStartY = useRef(0);

      const currentTrack = playlist[currentIndex];
      const currentTypography = TYPOGRAPHY_STYLES[fontIndex];

      const changeTrack = (direction) => {
        let nextIdx;
        if (isShuffle) {
          nextIdx = Math.floor(Math.random() * playlist.length);
        } else {
          nextIdx = direction === "next" 
            ? (currentIndex + 1) % playlist.length 
            : (currentIndex - 1 + playlist.length) % playlist.length;
        }
        setCurrentIndex(nextIdx);
        setCurrentTime(0);
      };

      // Permanent YouTube Player Initialization
      useEffect(() => {
        let isCancelled = false;

        const initPlayer = () => {
          if (!window.YT || !window.YT.Player || ytPlayerRef.current) return false;

          try {
            ytPlayerRef.current = new window.YT.Player("yt-player-persistent", {
              height: "100%",
              width: "100%",
              videoId: currentTrack.youtubeId,
              playerVars: {
                autoplay: 0,
                controls: 0,
                disablekb: 1,
                enablejsapi: 1,
                fs: 0,
                modestbranding: 1,
                playsinline: 1,
                rel: 0
              },
              events: {
                onReady: (e) => {
                  if (!isCancelled) setDuration(e.target.getDuration() || 180);
                },
                onStateChange: (e) => {
                  if (isCancelled) return;
                  if (e.data === window.YT.PlayerState.PLAYING) {
                    setIsPlaying(true);
                    setDuration(e.target.getDuration() || 180);
                    if (videoRef.current) videoRef.current.play().catch(() => {});
                  } else if (e.data === window.YT.PlayerState.PAUSED) {
                    setIsPlaying(false);
                    if (videoRef.current) videoRef.current.pause();
                  } else if (e.data === window.YT.PlayerState.ENDED) {
                    changeTrack("next");
                  }
                },
                onError: (e) => {
                  // Prevents playback hang on regional/ad/embed restriction errors
                  changeTrack("next");
                }
              }
            });
            return true;
          } catch (err) {
            return false;
          }
        };

        if (window.YT && window.YT.Player) {
          initPlayer();
        } else {
          window.onYouTubeIframeAPIReady = initPlayer;
          const poll = setInterval(() => {
            if (initPlayer()) clearInterval(poll);
          }, 100);
        }

        return () => {
          isCancelled = true;
          if (ytPlayerRef.current?.destroy) ytPlayerRef.current.destroy();
        };
      }, []);

      // Polling loop for lyric sync
      useEffect(() => {
        if (isPlaying) {
          timerRef.current = setInterval(() => {
            if (ytPlayerRef.current?.getCurrentTime) {
              const time = ytPlayerRef.current.getCurrentTime();
              setCurrentTime(time || 0);
            }
          }, 100);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isPlaying]);

      // Load Track on Index Change
      useEffect(() => {
        if (ytPlayerRef.current?.loadVideoById) {
          ytPlayerRef.current.loadVideoById(currentTrack.youtubeId);
          setCurrentTime(0);
          if (isPlaying) {
            ytPlayerRef.current.playVideo();
          }
        }
      }, [currentIndex]);

      const togglePlay = () => {
        if (!ytPlayerRef.current) return;
        if (isPlaying) {
          if (typeof ytPlayerRef.current.pauseVideo === 'function') {
            ytPlayerRef.current.pauseVideo();
          }
        } else {
          if (typeof ytPlayerRef.current.playVideo === 'function') {
            ytPlayerRef.current.playVideo();
          }
          if (videoRef.current) videoRef.current.play().catch(() => {});
        }
      };

      const seekRelative = (seconds) => {
        if (ytPlayerRef.current?.getCurrentTime && ytPlayerRef.current?.seekTo) {
          const newTime = Math.min(Math.max(ytPlayerRef.current.getCurrentTime() + seconds, 0), duration || 0);
          ytPlayerRef.current.seekTo(newTime, true);
          setCurrentTime(newTime);
        }
      };

      const toggleMute = () => {
        if (!ytPlayerRef.current) return;
        if (isMuted) {
          ytPlayerRef.current.unMute();
          setIsMuted(false);
        } else {
          ytPlayerRef.current.mute();
          setIsMuted(true);
        }
      };

      const nextTypography = (e) => {
        e.stopPropagation();
        setFontIndex((prev) => (prev + 1) % TYPOGRAPHY_STYLES.length);
      };

      const handleTouchStart = (e) => {
        touchStartY.current = e.touches[0].clientY;
      };

      const handleTouchEnd = (e) => {
        const diffY = touchStartY.current - e.changedTouches[0].clientY;
        if (diffY > 60) changeTrack("next");
        else if (diffY < -60) changeTrack("prev");
      };

      // Realtime lyric tracker
      const { activeText, nextText } = useMemo(() => {
        if (!currentTrack?.lyrics || currentTrack.lyrics.length === 0) {
          return { activeText: "♪ Playing Audio ♪", nextText: "" };
        }
        let current = currentTrack.lyrics[0].text;
        let next = currentTrack.lyrics[1]?.text || "";

        for (let i = 0; i < currentTrack.lyrics.length; i++) {
          if (currentTime >= currentTrack.lyrics[i].time) {
            current = currentTrack.lyrics[i].text;
            next = currentTrack.lyrics[i + 1]?.text || "";
          } else {
            break;
          }
        }
        return { activeText: current, nextText: next };
      }, [currentTime, currentTrack]);

      const progressPercent = Math.min(100, Math.max(0, (currentTime / (duration || 1)) * 100));

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = Math.floor(secs % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      return (
        <div 
          className="relative w-full h-[100dvh] bg-stone-950 overflow-hidden flex flex-col justify-between"
          onTouchStart={handleTouchStart}
          onTouchEnd={handleTouchEnd}
        >
          {/* Active YouTube Frame Container (Permanent z-0 layout avoids OS suspension) */}
          <div className="absolute inset-0 z-0 pointer-events-none opacity-[0.001] flex items-center justify-center overflow-hidden">
            <div id="yt-player-persistent"></div>
          </div>

          {/* Background Video Layer mapped to current song */}
          <video 
            ref={videoRef} 
            key={currentTrack.bgVideo} 
            src={currentTrack.bgVideo} 
            className="absolute inset-0 w-full h-full object-cover pointer-events-none z-0" 
            autoPlay 
            loop 
            muted 
            playsInline 
          />

          {/* Ambient Vignette & Screen Tap Zone */}
          <div 
            className="absolute inset-0 bg-gradient-to-b from-stone-950/75 via-stone-950/30 to-stone-950/90 cursor-pointer z-10"
            onClick={togglePlay} 
          />

          {/* Top Header */}
          <header className="relative z-20 safe-top px-4 flex items-center justify-between w-full">
            <div className="text-[11px] sm:text-xs uppercase tracking-wider text-amber-400 font-bold flex items-center gap-1.5 drop-shadow">
              <span className={`w-2 h-2 rounded-full bg-amber-400 ${isPlaying ? 'animate-pulse' : ''}`}></span>
              Aesthetic Ambience
            </div>

            <div className="flex items-center gap-2">
              {/* Typography Switcher Button */}
              <button 
                onClick={nextTypography} 
                className="bg-black/60 hover:bg-black/80 border border-amber-400/40 active:scale-95 text-amber-300 font-semibold px-2.5 sm:px-3.5 py-1 rounded-full text-[11px] sm:text-xs transition backdrop-blur-md flex items-center gap-1.5 shadow-lg" 
                title="Change Typography Style"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
                <span className="max-w-[85px] sm:max-w-[120px] truncate">{currentTypography.name}</span>
              </button>

              {/* Background Video Identifier */}
              <div 
                className="bg-black/60 border border-white/20 text-neutral-300 font-medium px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs backdrop-blur-md flex items-center gap-1"
                title="Current Background Video"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
                <span>bg_{currentIndex + 1}</span>
              </div>
            </div>
          </header>

          {/* ================= CENTER SYNCHRONIZED LYRICS ================= */}
          <main className="relative z-20 flex-1 flex flex-col items-center justify-center px-6 text-center pointer-events-none my-auto">
            <div className="max-w-2xl flex flex-col items-center gap-3 transition-all duration-500">
              <h1 
                key={activeText} 
                style={{ fontFamily: currentTypography.font }} 
                className={`text-2xl sm:text-4xl md:text-5xl leading-tight sm:leading-snug transition-all duration-300 lyric-active ${currentTypography.styleClass}`}
              >
                {activeText}
              </h1>

              {nextText && (
                <p 
                  style={{ fontFamily: currentTypography.font }} 
                  className="text-sm sm:text-lg md:text-xl text-white/40 tracking-wider font-light italic mt-1 line-clamp-1 transition-opacity duration-300"
                >
                  {nextText}
                </p>
              )}
            </div>
          </main>

          {/* ================= BOTTOM MUSIC CONTROLS ================= */}
          <footer className="relative z-20 safe-bottom px-4 sm:px-6 flex flex-col gap-3 bg-gradient-to-t from-black via-black/85 to-transparent pb-4">
            {/* Progress Bar & Timestamps */}
            <div className="w-full flex flex-col gap-1">
              <div 
                className="w-full h-4 flex items-center cursor-pointer touch-none" 
                onClick={(e) => {
                  const rect = e.currentTarget.getBoundingClientRect();
                  const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                  if (ytPlayerRef.current?.seekTo) {
                    ytPlayerRef.current.seekTo(pos * duration, true);
                    setCurrentTime(pos * duration);
                  }
                }}
              >
                <div className="w-full bg-white/20 h-1 rounded-full overflow-hidden">
                  <div className="bg-amber-400 h-full transition-all duration-75" style={{ width: `${progressPercent}%` }} />
                </div>
              </div>
              <div className="flex justify-between text-[10px] sm:text-xs text-stone-400 font-mono px-0.5">
                <span>{formatTime(currentTime)}</span>
                <span>{formatTime(duration)}</span>
              </div>
            </div>

            {/* Song Meta & Button Toolbar */}
            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
              <div className="min-w-0 pr-2 text-center sm:text-left">
                <h2 className="text-sm sm:text-base font-bold text-amber-300 truncate drop-shadow">{currentTrack.title}</h2>
                <p className="text-xs text-neutral-400 truncate">{currentTrack.artist}</p>
              </div>

              {/* Clean SVG Controls Toolbar */}
              <div className="flex items-center justify-center sm:justify-end gap-3 sm:gap-4">
                {/* Shuffle */}
                <button 
                  onClick={() => setIsShuffle(!isShuffle)} 
                  className={`p-1.5 transition active:scale-90 ${isShuffle ? "text-amber-400" : "text-neutral-400 hover:text-white"}`} 
                  title="Shuffle"
                >
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                </button>

                {/* Previous */}
                <button 
                  onClick={() => changeTrack("prev")} 
                  className="p-1.5 text-neutral-200 hover:text-white active:scale-90 transition" 
                  title="Previous Track"
                >
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                {/* Rewind 10s */}
                <button 
                  onClick={() => seekRelative(-10)} 
                  className="p-1.5 text-neutral-300 hover:text-white active:scale-90 transition" 
                  title="Rewind 10 seconds"
                >
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                </button>

                {/* Play / Pause Primary Button */}
                <button 
                  onClick={togglePlay} 
                  className="w-12 h-12 flex items-center justify-center bg-amber-400 text-stone-950 rounded-full transition transform hover:scale-105 active:scale-90 shadow-[0_0_15px_rgba(251,191,36,0.3)] shrink-0" 
                  title={isPlaying ? "Pause" : "Play"}
                >
                  {isPlaying ? (
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
                  ) : (
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" className="ml-1"><path d="M8 5v14l11-7z"/></svg>
                  )}
                </button>

                {/* Forward 10s */}
                <button 
                  onClick={() => seekRelative(10)} 
                  className="p-1.5 text-neutral-300 hover:text-white active:scale-90 transition" 
                  title="Forward 10 seconds"
                >
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11V9a4 4 0 0 0-4-4H3"></path><polyline points="17 23 21 19 17 15"></polyline><path d="M3 13v2a4 4 0 0 0 4 4h14"></path></svg>
                </button>

                {/* Next */}
                <button 
                  onClick={() => changeTrack("next")} 
                  className="p-1.5 text-neutral-200 hover:text-white active:scale-90 transition" 
                  title="Next Track"
                >
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>

                {/* Mute */}
                <button 
                  onClick={toggleMute} 
                  className="p-1.5 text-neutral-300 hover:text-white active:scale-90 transition" 
                  title={isMuted ? "Unmute" : "Mute"}
                >
                  {isMuted ? (
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                  ) : (
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                  )}
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
